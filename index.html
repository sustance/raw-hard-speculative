<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seeds Index</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .file-card { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .file-link { font-size: 1.2rem; font-weight: bold; color: #0366d6; text-decoration: none; }
        .file-link:hover { text-decoration: underline; }
        .description { color: #555; background: #f6f8fa; padding: 10px; border-radius: 5px; margin-top: 5px; white-space: pre-wrap; font-family: monospace; }
        .error-box { padding: 15px; background: #ffeef0; color: #d73a49; border-radius: 5px; border: 1px solid #f9c2c9; }
    </style>
</head>
<body>

    <h1>Seeds Index</h1>
    <div id="seed-list">Loading files from repository...</div>

    <script>
        const USERNAME = 'sustance';
        const REPO = 'raw-hard-speculative';
        const FOLDER = 'seeds'; 
        const LINES_TO_EXTRACT = 4;

        async function fetchSeeds() {
            const container = document.getElementById('seed-list');
            
            try {
                // Modified URL to explicitly target the root branch contents
                const url = `https://github.com{USERNAME}/${REPO}/contents/${FOLDER}`;
                const response = await fetch(url);
                
                if (response.status === 404) {
                    throw new Error(`The folder "${FOLDER}" was not found or is currently empty in the repository.`);
                }
                if (!response.ok) {
                    throw new Error(`GitHub API returned status code ${response.status}`);
                }
                
                const items = await response.json();
                container.innerHTML = ''; 

                let fileCount = 0;

                for (const item of items) {
                    if (item.type === 'file') {
                        fileCount++;
                        
                        // Fetch the raw text contents safely
                        const fileContentResponse = await fetch(item.download_url);
                        const fullText = await fileContentResponse.text();
                        
                        // Extract lines
                        const lines = fullText.split(/\r?\n/).slice(0, LINES_TO_EXTRACT);
                        const description = lines.join('\n');

                        // Build individual items
                        const card = document.createElement('div');
                        card.className = 'file-card';
                        card.innerHTML = `
                            <a class="file-link" href="${item.html_url}" target="_blank">${item.name}</a>
                            <div class="description">${description || '(Empty File)'}</div>
                        `;
                        container.appendChild(card);
                    }
                }

                if (fileCount === 0) {
                    container.innerHTML = `<p>No files found inside the "${FOLDER}" directory.</p>`;
                }

            } catch (error) {
                // Prints the precise error reason directly to your browser's Developer Console
                console.error("Detailed Fetch Error:", error);
                
                container.innerHTML = `
                    <div class="error-box">
                        <strong>Error:</strong> ${error.message}<br><br>
                        <small>If running locally via file:// layout, upload this file directly to GitHub Pages to bypass security blocks.</small>
                    </div>`;
            }
        }

        fetchSeeds();
    </script>
</body>
</html>
